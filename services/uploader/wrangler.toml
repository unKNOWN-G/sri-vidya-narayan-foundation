name = "swamiji-website-updates"
main = "entry.mjs"
compatibility_date = "2026-11-01"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[vars]
SITE_URL = "https://unknown-g.github.io/sri-vidya-narayan-foundation/"
GITHUB_REPOSITORY = "unKNOWN-G/sri-vidya-narayan-foundation"
PUBLISH_ENABLED = "false"

[[d1_databases]]
binding = "DB"
database_name = "swamiji-upload-inbox"
database_id = "2338838d-7d63-4197-be7c-f2cec5f7b0ca"

[triggers]
crons = ["17 3 * * *"]
