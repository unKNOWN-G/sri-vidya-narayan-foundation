<!doctype html><html lang="en"><meta charset="utf-8"><title>Mobile swipe regression checks</title><style>body{font:16px system-ui;max-width:850px;margin:30px auto;padding:20px;background:#faf7ef;color:#28313a}button{padding:14px}#fixture{height:160px;margin:20px 0;background:#ede3ce;touch-action:pinch-zoom;display:grid;place-items:center}li{margin:8px 0}.pass{color:#24653b}.fail{color:#a22}</style><h1>Mobile swipe regression checks</h1><p>Exercises the production swipe handler with touch events, including the pointer-cancellation stream seen on phones.</p><button id="run">Run touch regression checks</button><div id="fixture"><button id="card">Inner tile</button></div><ol id="results"></ol><p id="summary" role="status"></p><script src="../src/swipe-navigation.js"></script><script>
const fixture=document.querySelector('#fixture'),card=document.querySelector('#card'),results=document.querySelector('#results');
function touch(type,points,changed=points){const event=new Event(type,{bubbles:true,cancelable:true});Object.defineProperties(event,{touches:{value:points.map(p=>({identifier:p[0],clientX:p[1],clientY:p[2],target:card}))},changedTouches:{value:changed.map(p=>({identifier:p[0],clientX:p[1],clientY:p[2],target:card}))}});card.dispatchEvent(event);}
function pointer(type,x,y,pointerType='touch'){card.dispatchEvent(new PointerEvent(type,{bubbles:true,cancelable:true,pointerId:1,pointerType,isPrimary:true,button:0,buttons:type==='pointerup'?0:1,clientX:x,clientY:y}));}
function swipe(){touch('touchstart',[[0,280,100]]);touch('touchmove',[[0,80,110]]);touch('touchend',[],[[0,80,110]]);}
document.querySelector('#run').onclick=()=>{results.replaceChildren();let passed=0,total=0;
function check(name,action,expected,expectedClicks=0){total++;const changes=[];let clicks=0;const click=()=>clicks++;card.addEventListener('click',click);const unbind=foundationGestures.bindSwipe(fixture,{onSwipe:d=>changes.push(d)});let error='';try{action(unbind);if(JSON.stringify(changes)!==JSON.stringify(expected)||clicks!==expectedClicks)throw Error('changes='+JSON.stringify(changes)+', clicks='+clicks);}catch(e){error=e.message;}unbind();card.removeEventListener('click',click);const li=document.createElement('li');li.className=error?'fail':'pass';li.textContent=(error?'FAIL ':'PASS ')+name+(error?' — '+error:'');results.append(li);if(!error)passed++;}
check('Touch swipe left, identifier zero',()=>swipe(),[1]);
check('Initial diagonal finger movement still becomes a swipe',()=>{touch('touchstart',[[0,280,100]]);touch('touchmove',[[0,272,110]]);touch('touchmove',[[0,240,112]]);touch('touchend',[],[[0,80,120]]);},[1]);
check('Browser pointercancel does not discard an active touch',()=>{pointer('pointerdown',280,100);touch('touchstart',[[0,280,100]]);pointer('pointercancel',270,110);touch('touchmove',[[0,180,115]]);touch('touchend',[],[[0,80,120]]);},[1]);
check('Touch swipe right selects previous tile',()=>{touch('touchstart',[[0,70,100]]);touch('touchmove',[[0,250,110]]);touch('touchend',[],[[0,270,110]]);},[-1]);
check('Short 35px touch swipe is accepted',()=>{touch('touchstart',[[0,160,100]]);touch('touchmove',[[0,125,103]]);touch('touchend',[],[[0,125,103]]);},[1]);
check('Vertical movement does not switch tiles',()=>{touch('touchstart',[[0,150,100]]);touch('touchmove',[[0,153,155]]);touch('touchend',[],[[0,154,210]]);},[]);
check('A normal tap still opens the tile',()=>{touch('touchstart',[[0,150,100]]);touch('touchend',[],[[0,151,101]]);card.click();},[],1);
check('Swipe release cannot accidentally open a tile',()=>{swipe();card.click();},[1]);
check('Compatibility mouse stream cannot switch a second time',()=>{swipe();pointer('pointerdown',280,100,'mouse');pointer('pointermove',80,110,'mouse');pointer('pointerup',80,110,'mouse');},[1]);
check('Two-finger gesture cancels tile selection',()=>{touch('touchstart',[[0,280,100]]);touch('touchstart',[[0,280,100],[1,180,100]]);touch('touchend',[],[[0,80,100],[1,60,100]]);},[]);
check('Leaving a page removes its touch listeners',unbind=>{touch('touchstart',[[0,280,100]]);unbind();touch('touchmove',[[0,80,100]]);touch('touchend',[],[[0,80,100]]);},[]);
document.querySelector('#summary').textContent=`${passed} of ${total} touch checks passed`;};
</script><h2>Actual mobile card integration</h2><button id="run-integration">Test swipes on the education page</button><p id="integration-result" role="status"></p><iframe id="app" title="Mobile education cards" src="/app/index.html#/category/education/schools/yelahanka" style="width:390px;height:844px;border:1px solid #ccc"></iframe><script>
document.querySelector('#run-integration').onclick=()=>{
 const frame=document.querySelector('#app'),win=frame.contentWindow,doc=frame.contentDocument,result=document.querySelector('#integration-result');
 function gesture(direction){const target=doc.querySelector('.deck-card[data-position="front"] img')||doc.querySelector('.deck-card[data-position="front"]');if(!target)throw Error('Education page not ready');const r=target.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2;
 target.dispatchEvent(new win.PointerEvent('pointerdown',{bubbles:true,pointerType:'touch',isPrimary:true,pointerId:1,button:0,clientX:x,clientY:y}));
 function send(type,touches,changed){const event=new win.Event(type,{bubbles:true,cancelable:true});Object.defineProperties(event,{touches:{value:touches},changedTouches:{value:changed||touches}});target.dispatchEvent(event);}
 const point=(dx,dy)=>({identifier:0,clientX:x+dx,clientY:y+dy,target});send('touchstart',[point(0,0)]);send('touchmove',[point(-direction*8,10)]);target.dispatchEvent(new win.PointerEvent('pointercancel',{bubbles:true,pointerType:'touch',pointerId:1}));send('touchmove',[point(-direction*110,12)]);send('touchend',[],[point(-direction*110,12)]);}
 try{doc.querySelector('.occasion-stop[href="#/category/education/schools/yelahanka"]').click();const session=doc.querySelector('.section-spotlight').dataset.deckSession;gesture(1);const after=doc.querySelector('.deck-caption h2').textContent;if(after!=='ZP High School, Gollapalli')throw Error('Next card: '+after);gesture(-1);const back=doc.querySelector('.deck-caption h2').textContent;if(back!=='Air Force School, Yelahanka')throw Error('Previous card: '+back);if(doc.querySelector('.section-spotlight').dataset.deckSession!==session)throw Error('Page reloaded');if(win.getComputedStyle(doc.querySelector('.deck-scene')).touchAction!=='pinch-zoom')throw Error('Mobile touch-action missing');result.textContent='PASS actual mobile education cards: next, previous, pointer cancellation, no page refresh, no native one-finger panning';}catch(e){result.textContent='FAIL '+e.message;}
};
</script></html>
